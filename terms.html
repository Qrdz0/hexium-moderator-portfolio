<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terms of Use | Qrdz</title>
  <meta name="description" content="Terms of use for Qrdz's non-commercial Hexium moderator portfolio.">
  <meta name="theme-color" content="#09090b">
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: "Inter"; src: url("fonts/inter.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Space Grotesk"; src: url("fonts/space-grotesk.woff2") format("woff2"); font-weight: 300 700; font-display: swap; }
    :root { --bg: #09090b; --line: rgb(250 250 250 / 0.08); --text: #fafafa; --text-2: #a1a1aa; --text-3: #8b8b94; --accent: #06b6d4; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.6 "Inter", ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 680px; margin: 0 auto; padding: 48px 20px 80px; }
    a { color: var(--text); text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .back { display: inline-flex; align-items: center; min-height: 44px; color: var(--text-2); text-decoration: none; }
    .back:hover { color: var(--text); }
    h1 { margin: 32px 0 8px; font: 600 clamp(2rem, 6vw, 2.75rem)/1.1 "Space Grotesk", "Inter", sans-serif; letter-spacing: -0.02em; }
    h2 { margin: 40px 0 8px; font: 500 18px/1.4 "Space Grotesk", "Inter", sans-serif; }
    p { margin: 0; color: var(--text-2); }
    .meta { font: 13px ui-monospace, "SF Mono", Consolas, monospace; color: var(--text-3); }
    .lead { margin-top: 32px; padding-top: 32px; border-top: 1px solid var(--line); font-size: 18px; color: var(--text); }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">← Back to portfolio</a>
    <h1>Terms of Use</h1>
    <p class="meta">Last updated 22 November 2026</p>

    <p class="lead">This is a non-commercial personal portfolio. All external links belong to their respective owners.</p>

    <h2>Hexium name and logo</h2>
    <p>The Hexium name and logo belong to Hexium and are shown here only to describe my role on its staff team.</p>
  </main>
</body>
</html>
